# Note: Dependabot PR titles ("Bump x from 1.0.0 to 1.1.0") don't match any
# of the conventional-commit prefixes that release-label.yml infers a release
# label from, so Dependabot PRs will need a release:* label applied manually
# before they can merge (release-label.yml requires exactly one).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        patterns:
          - "*"
