# Dependabot titles its PRs "build(deps): ..." / "build(deps-dev): ...", which
# release-label.yml infers release:none from, so these PRs self-label and need
# no manual intervention. Changing the title format here would break that.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        patterns:
          - "*"
