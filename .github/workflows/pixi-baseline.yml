name: Record Pixi visual baseline

# Regenerates the platform-specific reference frames the Pixi visual guard
# compares against, and commits them to the branch it is dispatched on.
#
# WHY THIS EXISTS
#
# #133 made the references platform-specific, because Playwright frames are
# deterministic per platform but not across them (win32 and linux differed by a
# max channel delta of 230 across 10.6% of pixels). That was the right call, but
# it left a gap: a maintainer on Windows can regenerate win32 locally and has no
# way to produce the linux set, even though linux is the canonical CI
# environment. The gap surfaced in #147, where a legitimate change to what the
# guard captures required new baselines on both platforms.
#
# CI already runs the guard on ubuntu-latest with Node 22, so the environment
# that judges the frames can also produce them. This job is that environment,
# run deliberately.
#
# NEVER runs automatically. A baseline is a statement that the current render is
# correct, which is a human judgement — a scheduled or on-push regeneration
# would quietly bless whatever regression happened to be in the tree. Dispatch
# it only after looking at what changed and deciding the new frames are right.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the baseline is being re-recorded (goes in the commit message)'
        required: true
        type: string

concurrency:
  group: pixi-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the regenerated frames back to the dispatched branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # pixi:visual-update runs the build itself via its pre-script, so the
      # frames come from the same dist/ the guard would check.
      - name: Re-record the linux baseline
        run: npm run pixi:visual-update

      - name: Show what changed
        run: git --no-pager diff --stat tests/fixtures/reference-frames/pixi/

      # Uploaded as well as committed: if the commit step is ever removed or
      # the push is rejected, the frames are still recoverable from the run.
      - name: Upload the recorded baseline
        uses: actions/upload-artifact@v7
        with:
          name: pixi-baseline-linux
          path: tests/fixtures/reference-frames/pixi/linux/
          if-no-files-found: error
          retention-days: 14

      - name: Commit the baseline
        run: |
          if git diff --quiet -- tests/fixtures/reference-frames/pixi/; then
            echo "Baseline already current — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to the reference directory on purpose: this job regenerates
          # baselines and must never sweep up unrelated working-tree changes.
          git add tests/fixtures/reference-frames/pixi/
          git commit -m "chore: re-record Pixi visual baseline (linux)" \
                     -m "${{ inputs.reason }}" \
                     -m "Recorded by .github/workflows/pixi-baseline.yml on ubuntu-latest."
          git push origin HEAD:${{ github.ref_name }}
