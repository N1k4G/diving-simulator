name: PR Checks

# Runs on every pull request targeting main: both client checks and a set of
# review screenshots. Deployment lives in deploy.yml and only runs on
# push to main (i.e. after a PR is merged) — nothing here deploys.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check migration client
        run: npm run build

      # The bundle is the thing that ships, so the assertion is on its bytes,
      # not on the source that produced them. Runs right after the build and
      # before anything else touches dist/, so a failure names the build that
      # caused it (#161).
      - name: Check the production bundle carries no diagnostics
        run: npm run dist:check

      # #137 A3 (#293): the Android job packages these bytes rather than build
      # its own, so what ships in the APK is what this job checked. Recorded and
      # handed over right after the hygiene check passed them; the last step of
      # this job checks the tests below ran over the same bytes.
      - name: Record the verified dist/ for the Android build
        run: |
          node scripts/android-bundle-check.mjs hash dist > verified-dist.sha256
          echo "Verified dist/ tree hash: \`$(cat verified-dist.sha256)\`" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified dist/
        uses: actions/upload-artifact@v7
        with:
          name: verified-dist
          path: |
            dist/
            verified-dist.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: License check
        run: npm run license-check

      - name: Check generated site resources are current
        run: npm run sites:check

      # The dev container claims a run inside it predicts a run here, and that
      # rests on pins in three files that nothing else compares. Dependabot moves
      # Playwright on its own schedule, so without this the container rots between
      # one rebuild and the next and only the next person to rebuild finds out.
      - name: Check dev container pins match this workflow
        run: npm run devcontainer:check -- --toolchain

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pixi visual regression check
        run: npm run pixi:visual-check

      # The checker writes <scene>.actual.png beside its reference on a breach
      # and tells the reviewer to look at it. Without this the runner exits and
      # the only copy is gone — and the references are platform-keyed, so a
      # maintainer on another OS cannot reproduce these pixels locally.
      - name: Upload Pixi visual diff frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixi-visual-actual-frames
          path: tests/fixtures/reference-frames/pixi/**/*.actual.png
          if-no-files-found: ignore
          retention-days: 7

      # Issue #124: the interiors went flat twice, once per renderer surface,
      # and nothing caught either. This is the guard, and unlike the Pixi one it
      # enforces hand-set thresholds rather than recorded frames — see the header
      # of the script for why recording them would defeat the purpose.
      - name: Interior optics check
        run: npm run interior:check

      - name: Upload interior optics diff frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interior-optics-actual-frames
          path: tests/fixtures/reference-frames/interior-optics/*.actual.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Run migration client unit tests
        run: npm run test:unit

      - name: Run core parity tests
        run: npm run test:parity

      - name: Run legacy client tests
        run: npm run test:e2e

      - name: Generate review screenshots
        run: npm run screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-screenshots
          path: screenshots/
          retention-days: 14

      # #137 A13a: the client we ship, at a phone viewport. Reuses the dist/
      # the build step made; evidence for a reviewer, with no reference frames
      # and no thresholds (it fails only when a frame cannot be taken or is
      # blank). Does not rebuild.
      - name: Capture phone screenshots of the migration client
        env:
          # HEAD on a pull_request run is the synthetic merge commit; the
          # evidence index records the PR's own head too.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run screenshots:phone

      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-screenshots
          path: artifacts/wp-09/137/phone-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The Pixi check and the browser tests rebuild dist/ through their npm
      # pre-scripts. The build is deterministic, so this holds; if it ever does
      # not, the APK would package bytes the browser tests never ran over, and
      # that has to fail here rather than pass unnoticed (#293).
      - name: Check the tested dist/ is the one handed to the Android build
        run: |
          tested="$(node scripts/android-bundle-check.mjs hash dist)"
          if [ "$tested" != "$(cat verified-dist.sha256)" ]; then
            echo "::error::dist/ now hashes to $tested, not to the verified $(cat verified-dist.sha256): a rebuild produced different bytes."
            exit 1
          fi

  # #137 A3 (#293): the Android debug build as a compile gate over the same
  # verified dist/. A job of its own so it runs beside verify: it sets up while
  # verify builds, then takes verify's dist/ and its recorded hash instead of
  # running a second Vite build, syncs exactly those bytes into the native
  # project, assembles a debug APK and checks what ended up inside it. Debug
  # only: no signing material exists in the repository or in this job.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Reading this run's artifact list, to wait for verify's upload.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Pinned to the exact build: Capacitor 8's Android library compiles for
      # Java 21, and a floating `21` moves under the build without a commit.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production CI refuses a dev server URL or cleartext live reload in the
      # config before anything is built with it; the APK's own copy is checked
      # again below.
      - name: Check the Capacitor config is production-safe
        run: node scripts/android-bundle-check.mjs config

      - name: Check no signing material is in the repository
        run: |
          found="$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pk8' '*.pem' 'android/**/keystore.properties')"
          if [ -n "$found" ]; then
            echo "::error::signing material is committed: $found"
            exit 1
          fi

      # Capacitor 8 needs density in configChanges or the WebView reloads on a
      # display-size change (#137 A8). Generated that way; this keeps it so.
      - name: Check the activity keeps density in configChanges
        run: grep -Eq 'android:configChanges="([^"]*[|])?density([|][^"]*)?"' android/app/src/main/AndroidManifest.xml

      # gradle-wrapper.jar is a committed binary that runs on this runner. Its
      # checksum is Gradle's published one for 8.14.3
      # (https://services.gradle.org/distributions/gradle-8.14.3-wrapper.jar.sha256);
      # the distribution it downloads is pinned by distributionSha256Sum in
      # gradle-wrapper.properties.
      - name: Verify the committed Gradle wrapper
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      # The runner image ships an Android SDK; this pins the platform and the
      # build tools variables.gradle names instead of trusting the image's set.
      - name: Install the pinned Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version

      # Waits for verify's upload, downloads it and checks its tree hash
      # before moving it into dist/; shared with the browsers job below.
      - name: Take the verified dist/
        uses: ./.github/actions/verified-dist

      - name: Sync the verified dist/ into the Android project
        run: npx cap sync android

      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # The assertion is on the APK, not on the directory it was built from:
      # its web root must be the verified dist/ byte for byte (plus Capacitor's
      # two empty Cordova stubs), its config must be production-safe, and the
      # production-shell hygiene check must pass over those exact bytes.
      - name: Check the APK packages the verified dist/
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -q "$apk" 'assets/*' -d apk
          node scripts/android-bundle-check.mjs apk apk "$(cat verified/verified-dist.sha256)"
          node scripts/dist-check.mjs apk/assets/public

      - name: Check the APK's identity, SDK levels and cleartext policy
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$badging" | grep -q "^package: name='monster.gorman.scuba.divingsimulator.dev'"
          echo "$badging" | grep -Eq "^(sdkVersion|minSdkVersion):'29'$"
          echo "$badging" | grep -q "^targetSdkVersion:'36'$"
          if "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q usesCleartextTraffic; then
            echo "::error::the APK's manifest sets usesCleartextTraffic, which only live reload needs."
            exit 1
          fi

      # For a reviewer with a device; signed only with the runner's throwaway
      # debug key, which is neither kept nor uploaded.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # #302 (#137 A14a): the functional Playwright suite in Firefox and WebKit,
  # over the same verified dist/ as the android job and with no second Vite
  # build. Beside verify rather than inside it, and each engine in two shards,
  # so a PR waits no longer than verify's own Chromium run. Tests tagged
  # @chromium-only (CDP input or accessibility tree, see playwright.config.js)
  # are left out; the Pixi pixel-diff and interior optics checks stay in verify,
  # Chromium only. Not a required check: it becomes one after about ten green
  # runs and with the product owner's consent (docs/decisions.md, "CI and
  # evidence").
  browsers:
    name: browsers (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      # Reading this run's artifact list, to wait for verify's upload.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The browser build is pinned by playwright-core in package-lock.json,
      # as verify's Chromium is; the dev container's image carries the same.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Take the verified dist/
        uses: ./.github/actions/verified-dist

      # Straight through npx, not npm run test:e2e, whose pre-script would
      # rebuild dist/.
      - name: Run the functional suite
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
