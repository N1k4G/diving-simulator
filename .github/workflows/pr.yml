name: PR Checks

# Runs on every pull request targeting main: both client checks and a set of
# review screenshots. Deployment lives in deploy.yml and only runs on
# push to main (i.e. after a PR is merged) — nothing here deploys.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check migration client
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: License check
        run: npm run license-check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run migration client unit tests
        run: npm run test:unit

      - name: Run legacy client tests
        run: npm run test:e2e

      - name: Generate review screenshots
        run: npm run screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-screenshots
          path: screenshots/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
