name: PR Checks

# Runs on every pull request targeting main: both client checks and a set of
# review screenshots. Deployment lives in deploy.yml and only runs on
# push to main (i.e. after a PR is merged) — nothing here deploys.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check migration client
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: License check
        run: npm run license-check

      - name: Check generated site resources are current
        run: npm run sites:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pixi visual regression check
        run: npm run pixi:visual-check

      # The checker writes <scene>.actual.png beside its reference on a breach
      # and tells the reviewer to look at it. Without this the runner exits and
      # the only copy is gone — and the references are platform-keyed, so a
      # maintainer on another OS cannot reproduce these pixels locally.
      - name: Upload Pixi visual diff frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixi-visual-actual-frames
          path: tests/fixtures/reference-frames/pixi/**/*.actual.png
          if-no-files-found: ignore
          retention-days: 7

      # Issue #124: the interiors went flat twice, once per renderer surface,
      # and nothing caught either. This is the guard, and unlike the Pixi one it
      # enforces hand-set thresholds rather than recorded frames — see the header
      # of the script for why recording them would defeat the purpose.
      - name: Interior optics check
        run: npm run interior:check

      - name: Upload interior optics diff frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interior-optics-actual-frames
          path: tests/fixtures/reference-frames/interior-optics/*.actual.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Run migration client unit tests
        run: npm run test:unit

      - name: Run core parity tests
        run: npm run test:parity

      - name: Run legacy client tests
        run: npm run test:e2e

      - name: Generate review screenshots
        run: npm run screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-screenshots
          path: screenshots/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
