<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061923" />
    <!-- Injected from the string catalogue at build time by the
         `inject-app-title` plugin in vite.config.mts, so this title cannot
         drift from `wreck.brand`. These are the bytes a tab, a WebView and a
         link preview show before the module runs; renderWreckApplication()
         replaces it with the localized title once the locale is known. -->
    <title>%APP_TITLE%</title>
  </head>
  <body>
    <!-- No aria-live here. The wreck HUD mounts into #app and updates depth,
         dive time, gas, NDL and zone every frame; a live region at the root
         made a screen reader try to announce all of them continuously. The one
         announcement that matters, a safety warning, is carried by the
         role="alert" paragraph the shell builds itself (#138). The status chip
         is a visual redundancy for that and must stay silent. -->
    <main id="app"></main>
    <script type="module" src="/src/app/bootstrap.ts"></script>
  </body>
</html>
