    {
        id: 'TC-38-NO-HINT-DURING-FAST-FORWARD',
        name: 'Issue #38 — hint queue does not start a new toast while fast-forwarding',
        fn: function() {
            api.resetAllHintsForTests();
            api.diveMode = 'rec';
            api.diveSite = 'open';
            setupDive([[0.21, 0, 200]]);
            // updateDiving()'s own fast-forward eligibility gate (top of the
            // function) force-sets fastForwardActive = false every tick
            // unless the diver is genuinely at an active deco/safety stop —
            // so this test must build a real safety-stop-active scenario
            // (same setup as TC-30) rather than just poking the flag at an
            // arbitrary depth, or the eligibility gate silently cancels it
            // before the hint pump ever sees it as true.
            api.setDepth(15);
            api.clearKeys();
            for (var i = 0; i < 10; i++) {
                api.setDepth(15);
                api.updateDiving(0.5);
            }
            assert(api.safetyStopNeeded === true, 'setup: safetyStopNeeded should be true at 15m');
            api.setDepth(5);
            api.updateDiving(0.033);
            assert(api.safetyStopCountdownStarted === true, 'setup: safety-stop countdown should have started at 5m');
            // The setup above genuinely trips the built-in safetyStop hint
            // trigger (and BCD, since depth > HINT_BCD_MIN_DEPTH throughout)
            // and they auto-display immediately since fast-forward wasn't
            // active yet — clear hint state again so the assertions below
            // start from a clean slate, without losing the safety-stop-
            // active physics state we just built. Mark EVERY edge as
            // already-fired (mutating the live hintEdges object the getter
            // returns): safetyStopNeeded stays true for the rest of this
            // dive, and current.active can roll on randomly during any
            // updateDiving() tick (Phase B's current mechanic) — either
            // would otherwise re-trigger and enqueue an unwanted extra hint
            // on the fast-forward tick below, unrelated to what this test
            // is actually checking.
            api.resetAllHintsForTests();
            api.hintEdges.bcd = true;
            api.hintEdges.ndl = true;
            api.hintEdges.safetyStop = true;
            api.hintEdges.deco = true;
            api.hintEdges.overhead = true;
            api.hintEdges.current = true;
            // Force-enqueue a hint directly (independent of trigger paths).
            api.showHintOnce('bcd', 'hintBcd');
            assert(api.hintQueue.length === 1, 'BCD hint should be queued for display');
            assert(api.hintNotifyTime === 0, 'no hint should be visible yet');
            // NOTE: fastForwardActive is declared with `let` in state.js, so
            // unlike `var`-declared globals it does NOT become a window
            // property — must go through the gameAPI accessor, not
            // window.fastForwardActive (which would silently no-op).
            api.fastForwardActive = true;
            api.setDepth(5);
            api.updateDiving(0.033);
            assert(api.fastForwardActive === true, 'setup: fastForwardActive must still be true — depth must stay in the active safety-stop window for the eligibility gate to allow it');
            assert(api.hintNotifyTime === 0,
                'fast-forward must suppress the toast start; got hintNotifyTime=' + api.hintNotifyTime);
            assert(api.hintQueue.length === 1,
                'hint must remain queued for later; got queue length ' + api.hintQueue.length);
            // Cancelling fast-forward lets the pump drain the queue.
            api.fastForwardActive = false;
            api.updateDiving(0.033);
            assert(api.hintNotifyTime > 0,
                'once fast-forward ends the pump should start the toast; got ' + api.hintNotifyTime);
            assert(api.hintQueue.length === 0, 'queue should drain once toast starts');
            return 'PASS — fast-forward suppresses the pump but does not drop the hint';
        }
    },

    }
];

// ============================================================
//  TEST RUNNER
// ============================================================

function renderResults() {
    var el = document.getElementById('results');
    var html = '';
    for (var i = 0; i < tests.length; i++) {
        var t = tests[i];
        var r = results[t.id];
        var cls = 'pending';
        var badge = 'PENDING';
        var detail = '';
        if (r) {
            cls = r.pass ? 'pass' : 'fail';
            badge = r.pass ? 'PASS' : 'FAIL';
            detail = r.detail;
        }
        html += '<div class="card ' + cls + '">' +
            '<div class="card-header">' +
            '<span class="card-title">' + t.id + ': ' + t.name + '</span>' +
            '<span class="badge ' + cls + '">' + badge + '</span>' +
            '</div>' +
            (detail ? '<div class="card-detail">' + detail + '</div>' : '') +
            '</div>';
    }
    el.innerHTML = html;
}

function updateSummary() {
    var total = tests.length;
    var passed = 0;
    var failed = 0;
    var pending = 0;
    for (var i = 0; i < tests.length; i++) {
        var r = results[tests[i].id];
        if (!r) { pending++; }
        else if (r.pass) { passed++; }
        else { failed++; }
    }
    var el = document.getElementById('summary');
    if (running) {
        el.innerHTML = '<span class="pending">Running...</span> &nbsp; <span class="pass">' + passed + ' passed</span> &nbsp; <span class="fail">' + failed + ' failed</span> &nbsp; <span class="pending">' + pending + ' pending</span>';
    } else {
        el.innerHTML = '<span class="pass">' + passed + '/' + total + ' passed</span>' +
            (failed > 0 ? ' &nbsp; <span class="fail">' + failed + ' failed</span>' : '') +
            (pending > 0 ? ' &nbsp; <span class="pending">' + pending + ' pending</span>' : '');
    }
}

function runSingleTest(idx) {
    var t = tests[idx];
    results[t.id] = { pass: false, detail: 'Running...' };
    renderResults();
    try {
        var detail = t.fn();
        results[t.id] = { pass: true, detail: detail };
    } catch(e) {
        results[t.id] = { pass: false, detail: e.message };
    }
    renderResults();
    updateSummary();
}

function runAllTests(callback) {
    if (running) return;
    running = true;
    results = {};
    renderResults();
    updateSummary();
    setButtonsDisabled(true);

    var idx = 0;
    function next() {
        if (idx >= tests.length) {
            running = false;
            updateSummary();
            setButtonsDisabled(false);
            // Expose structured results for programmatic access (agent/Playwright)
            var total = tests.length, passed = 0, failed = 0;
            var testResults = [];
            for (var i = 0; i < tests.length; i++) {
                var r = results[tests[i].id];
                var entry = { id: tests[i].id, name: tests[i].name, pass: r ? r.pass : false, detail: r ? r.detail : 'NOT RUN' };
                testResults.push(entry);
                if (r && r.pass) passed++; else failed++;
            }
            window.testResults = { total: total, passed: passed, failed: failed, done: true, tests: testResults };
            if (callback) callback(window.testResults);
            return;
        }
        runSingleTest(idx);
        idx++;
        // Use setTimeout to allow UI repaint between tests
        setTimeout(next, 10);
    }
    next();
}

function setButtonsDisabled(disabled) {
    document.getElementById('btnRunAll').disabled = disabled;
    var btns = document.querySelectorAll('.individual');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = disabled;
}

// ============================================================
//  EVENT BINDINGS
// ============================================================

document.getElementById('btnRunAll').addEventListener('click', runAllTests);

var indivBtns = document.querySelectorAll('.individual');
for (var i = 0; i < indivBtns.length; i++) {
    (function(idx) {
        indivBtns[idx].addEventListener('click', function() {
            if (running) return;
            running = true;
            setButtonsDisabled(true);
            runSingleTest(idx);
            running = false;
            updateSummary();
            setButtonsDisabled(false);
        });
    })(i);
}

// Initial render
renderResults();

// Expose testResults early (not done yet)
window.testResults = { total: tests.length, passed: 0, failed: 0, done: false, tests: [] };

// Auto-run when ?autorun is in the URL (for agent/Playwright invocation)
if (window.location.search.indexOf('autorun') !== -1) {
    iframe.addEventListener('load', function autoRun() {
        iframe.removeEventListener('load', autoRun);
        // Small delay to ensure gameAPI is ready
        setTimeout(function() { runAllTests(); }, 100);
    });
}
</script>
</body>
</html>
