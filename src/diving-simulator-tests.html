* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e17;
    color: #e0e6f0;
    padding: 24px;
    min-height: 100vh;
}
h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    color: #7ec8f8;
}
.subtitle {
    color: #6b7a8d;
    margin-bottom: 20px;
    font-size: 0.9rem;
}
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}
button {
    background: #1a2233;
    color: #c0cfe0;
    border: 1px solid #2a3a50;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
}
button:hover { background: #243044; border-color: #3a5070; }
button.primary {
    background: #1a6b3a;
    border-color: #28a060;
    color: #d0ffd8;
    font-weight: 600;
    padding: 10px 24px;
    font-size: 0.95rem;
}
button.primary:hover { background: #208548; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.summary {
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #111827;
    border-radius: 8px;
    border: 1px solid #1e293b;
    font-size: 0.95rem;
}
.summary .pass { color: #4ade80; font-weight: 600; }
.summary .fail { color: #f87171; font-weight: 600; }
.summary .pending { color: #6b7a8d; }
.results {
    display: grid;
    gap: 12px;
}
.card {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 14px 18px;
    transition: border-color 0.2s;
}
.card.pass { border-left: 4px solid #4ade80; }
.card.fail { border-left: 4px solid #f87171; }
.card.running { border-left: 4px solid #facc15; }
.card.pending { border-left: 4px solid #334155; }
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}
.card-title { font-weight: 600; font-size: 0.95rem; }
.badge {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
}
.badge.pass { background: #14532d; color: #4ade80; }
.badge.fail { background: #7f1d1d; color: #f87171; }
.badge.running { background: #713f12; color: #facc15; }
.badge.pending { background: #1e293b; color: #64748b; }
.card-detail {
    font-size: 0.82rem;
    color: #8896a8;
    white-space: pre-wrap;
    margin-top: 4px;
    line-height: 1.5;
}
iframe { display: none; }

<script>
// ============================================================
//  TEST HARNESS
// ============================================================

var api = null;
var tests = [];
var results = {};
var running = false;

var iframe = document.getElementById('gameFrame');
iframe.addEventListener('load', function() {
    api = iframe.contentWindow.gameAPI;
    if (!api) {
        document.getElementById('summary').innerHTML = '<span class="fail">ERROR: gameAPI not found on iframe.contentWindow</span>';
        return;
    }
    document.getElementById('summary').innerHTML = '<span class="pending">Ready — click Run All Tests or an individual test.</span>';
    document.getElementById('btnRunAll').disabled = false;
    var btns = document.querySelectorAll('.individual');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
});

// Helpers
function setupDive(tankList) {
    // resetDive does NOT call initTanks — it only resets gasRemaining on existing tanks.
    // We must manually clear the tanks array before pushing test tanks.
    api.tanks.length = 0;
    api.tankCount = 0;
    api.resetDive();
    // Freeze the shark timer so random shark spawns cannot interfere with non-shark tests.
    // Shark-specific tests (TC-17..TC-21) override these directly.
    api.shark = null;
    api.sharkTimer = 1e9;
    for (var i = 0; i < tankList.length; i++) {
        var t = tankList[i];
        api.pushTank(t[0], t[1], t[2]);
    }
    api.activeTank = 0;
    api.gameState = 'diving';
}

function runFrames(n, dtReal, holdDepth) {
    if (dtReal === undefined) dtReal = 0.033;
    for (var i = 0; i < n; i++) {
        if (holdDepth !== undefined) api.setDepth(holdDepth);
        api.updateDiving(dtReal);
        if (api.gameState === 'gameover' || api.gameState === 'post-dive') break;
    }
}

function assert(condition, msg) {
    if (!condition) throw new Error('ASSERT FAILED: ' + msg);
}

function approx(a, b, tol) {
    if (tol === undefined) tol = 0.05;
    return Math.abs(a - b) <= tol;
}

// ============================================================
//  TEST DEFINITIONS
// ============================================================

tests = [
    // ----------------------------------------------------------
    // TC-01: Basic Air Dive
    // ----------------------------------------------------------
    {
        id: 'TC-01',
        name: 'Basic Air Dive — 18m, 30min, ascend safely',
        fn: function() {
            setupDive([[0.21, 0, 200]]);

            // Descend & teleport to 18m
            api.setDepth(18);
            api.clearKeys();

            // Hold at 18m for 30 dive-minutes
            // frames = 30*60 / (0.033*3) ≈ 18182 — too many at 0.033.
            // Use larger dt: 0.5 real → 1.5 dive-sec/frame → 30*60/1.5 = 1200 frames
            var ndlOk = true;
            for (var i = 0; i < 1200; i++) {
                api.setDepth(18);
                api.updateDiving(0.5);
                if (api.gameState !== 'diving') {
                    return 'Game ended prematurely at frame ' + i + ': ' + api.gameState + ' — ' + api.gameOverReason;
                }
                if (api.calculateNDL() <= 0) { ndlOk = false; break; }
            }

            assert(api.gameState === 'diving', 'gameState should be diving, got ' + api.gameState);
            // NDL at 18m on air should last well beyond 30 min (NDL ~56min)
            assert(ndlOk, 'NDL should remain > 0 throughout 30min at 18m');

            // Controlled ascent — vent when rising too fast, add a touch of gas
            // when too slow, so the rate stays in a safe band (well under the
            // 18 m/min barotrauma threshold). Holding W the whole way would now
            // over-inflate and cause a runaway ascent (intended behaviour).
            for (var j = 0; j < 8000; j++) {
                if (api.ascentRate > 8)       api.setKeys({ w: false, s: true });
                else if (api.ascentRate < 3)  api.setKeys({ w: true,  s: false });
                else                          api.setKeys({ w: false, s: false });
                api.updateDiving(0.033);
                if (api.depth < 0.3) break;
            }
            api.clearKeys();

            // Should reach surface without game-over
            assert(api.gameState !== 'gameover', 'Should not game over on basic air dive, reason: ' + api.gameOverReason);
            assert(api.depth < 1, 'Should reach near surface, depth=' + api.depth.toFixed(1));

            return 'PASS — Held 18m for 30min (NDL stayed positive), ascended safely. Final depth: ' + api.depth.toFixed(1) + 'm';
        }
    },
    // ----------------------------------------------------------
    // TC-02: NDL Exhaustion
    // ----------------------------------------------------------
    {
        id: 'TC-02',
        name: 'NDL Exhaustion — 30m until NDL=0',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(30);
            api.clearKeys();

            var frameCount = 0;
            var maxFrames = 50000;
            // Use dt=0.5 for speed: 1.5 dive-sec/frame
            while (frameCount < maxFrames) {
                api.setDepth(30);
                api.updateDiving(0.5);
                frameCount++;
                if (api.gameState !== 'diving') break;
                if (api.calculateNDL() <= 0) break;
            }

            var ndl = api.calculateNDL();
            assert(ndl === 0, 'NDL should reach 0, got ' + ndl);

            // NDL=0 means tissue will exceed surface limit within 0.5 min.
            // Run a few more frames at depth to push tissue loading past the limit.
            for (var j = 0; j < 30; j++) {
                api.setDepth(30);
                api.updateDiving(0.5);
                if (api.gameState !== 'diving') break;
            }

            var ceiling = api.calculateCeiling();
            var diveMin = api.diveTime;

            assert(ceiling > 0, 'Ceiling should be > 0 after continued time at depth past NDL=0, got ' + ceiling.toFixed(1));

            return 'PASS — NDL reached 0, continued at depth → ceiling: ' + ceiling.toFixed(1) + 'm after ' + diveMin.toFixed(1) + ' dive-min at 30m';
        }
    },
    // ----------------------------------------------------------
    // TC-03: O2 Toxicity
    // ----------------------------------------------------------
    {
        id: 'TC-03',
        name: 'O2 Toxicity — EAN32 at 70m',
        fn: function() {
            setupDive([[0.32, 0, 200]]);
            api.setDepth(70);
            api.clearKeys();

            // PO2 = 0.32 * 8 = 2.56 — well above 1.6
            var po2 = api.calculatePO2();
            assert(po2 > 1.6, 'PO2 at 70m should be > 1.6, got ' + po2.toFixed(2));

            // Run frames until game-over (PO2_TOXICITY_TIME = 30 dive-sec)
            // dt=0.5 → 1.5 dive-sec/frame → ~20 frames needed
            for (var i = 0; i < 200; i++) {
                api.setDepth(70);
                api.updateDiving(0.5);
                if (api.gameState === 'gameover') break;
            }

            assert(api.gameState === 'gameover', 'Game should end from O2 toxicity, state=' + api.gameState);
            assert(api.gameOverReason.indexOf('O2 TOXICITY') >= 0, 'Reason should mention O2 TOXICITY, got: ' + api.gameOverReason);

            return 'PASS — PO2=' + po2.toFixed(2) + ', game over: ' + api.gameOverReason;
        }
    },
    // ----------------------------------------------------------
    // TC-04: Gas Depletion
    // ----------------------------------------------------------
    {
        id: 'TC-04',
        name: 'Gas Depletion — Air at 40m until empty',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(40);
            api.clearKeys();

            // Gas at 40m: SAC=15, Pamb=5, consumption=75 L/min. Tank=2400L → ~32 min.
            // dt=0.5 → 1.5 dive-sec/frame → 32*60/1.5 ≈ 1280 frames
            for (var i = 0; i < 2000; i++) {
                api.setDepth(40);
                api.updateDiving(0.5);
                if (api.gameState === 'gameover') break;
            }

            assert(api.gameState === 'gameover', 'Game should end from gas depletion, state=' + api.gameState);
            assert(api.gameOverReason === 'OUT OF GAS', 'Reason should be OUT OF GAS, got: ' + api.gameOverReason);

            var gasLeft = api.tanks[0].gasRemaining;
            return 'PASS — Gas depleted at 40m after ' + api.diveTime.toFixed(1) + ' dive-min. Remaining: ' + gasLeft.toFixed(1) + 'L. Reason: ' + api.gameOverReason;
        }
    },
    // ----------------------------------------------------------
    // TC-05: Safe Ascent
    // ----------------------------------------------------------
    {
        id: 'TC-05',
        name: 'Safe Ascent — 20m, 10min hold, ascend to surface',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(20);
            api.clearKeys();

            // Hold at 20m for 10 dive-minutes: 10*60/1.5 = 400 frames at dt=0.5
            for (var i = 0; i < 400; i++) {
                api.setDepth(20);
                api.updateDiving(0.5);
                if (api.gameState !== 'diving') {
                    return 'FAIL — Game ended during hold: ' + api.gameState + ' — ' + api.gameOverReason;
                }
            }

            // Ascend using w key at normal dt for realistic rate (~9m/min)
            api.setKeys({w: true});
            var reachedSurface = false;
            for (var j = 0; j < 5000; j++) {
                api.updateDiving(0.033);
                if (api.depth < 0.3) { reachedSurface = true; break; }
                if (api.gameState === 'gameover') {
                    return 'FAIL — Game over during ascent: ' + api.gameOverReason;
                }
                if (api.gameState === 'post-dive') { reachedSurface = true; break; }
            }
            api.clearKeys();

            assert(reachedSurface, 'Should reach surface, depth=' + api.depth.toFixed(1));
            assert(api.gameState !== 'gameover', 'Should not game over, reason: ' + api.gameOverReason);

            return 'PASS — Held 20m for 10min, ascended safely. Final state: ' + api.gameState + ', depth: ' + api.depth.toFixed(1) + 'm';
        }
    },
    // ----------------------------------------------------------
    // TC-06: DCS — Ceiling Violation
    // ----------------------------------------------------------
    {
        id: 'TC-06',
        name: 'DCS — Ceiling Violation (40m→0m skip)',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(40);
            api.clearKeys();

            // Hold at 40m for 30 dive-minutes to build deco obligation
            // 30*60/1.5 = 1200 frames at dt=0.5
            for (var i = 0; i < 1200; i++) {
                api.setDepth(40);
                api.updateDiving(0.5);
                if (api.gameState !== 'diving') {
                    return 'FAIL — Game ended during hold: ' + api.gameState + ' — ' + api.gameOverReason;
                }
            }

            var ceiling = api.calculateCeiling();
            // Teleport to surface — massive ceiling violation
            api.setDepth(0);

            // Run frames at surface — DCS_VIOLATION_TIME = 60 dive-sec → 60/1.5 = 40 frames
            for (var j = 0; j < 200; j++) {
                api.setDepth(0);
                api.updateDiving(0.5);
                if (api.gameState === 'gameover') break;
            }

            assert(api.gameState === 'gameover', 'Game should end from DCS, state=' + api.gameState);
            assert(api.gameOverReason === 'DECOMPRESSION SICKNESS', 'Reason should be DCS, got: ' + api.gameOverReason);

            return 'PASS — After 30min at 40m (ceiling=' + ceiling.toFixed(1) + 'm), teleported to 0m → ' + api.gameOverReason;
        }
    },
    // ----------------------------------------------------------
    // TC-07: Gas Switch
    // ----------------------------------------------------------
    {
        id: 'TC-07',
        name: 'Gas Switch — Air + EAN36 at 25m',
        fn: function() {
            setupDive([[0.21, 0, 200], [0.36, 0, 200]]);
            api.setDepth(25);
            api.clearKeys();
            api.updateDiving(0.033);

            // Check PO2 on Air at 25m: 0.21 * 3.5 = 0.735
            var po2Air = api.calculatePO2();
            assert(approx(po2Air, 0.735, 0.05), 'PO2 on Air at 25m should be ~0.735, got ' + po2Air.toFixed(3));

            // Switch to EAN36
            api.setActiveTankIdx(1);
            var po2Ean = api.calculatePO2();
            // 0.36 * 3.5 = 1.26
            assert(approx(po2Ean, 1.26, 0.05), 'PO2 on EAN36 at 25m should be ~1.26, got ' + po2Ean.toFixed(3));

            // recommendBestGas: EAN36 has PO2=1.26 ≤ 1.4, higher O2 than Air → should recommend tank 1
            var best = api.recommendBestGas();
            assert(best === 1, 'recommendBestGas should return 1 (EAN36), got ' + best);

            return 'PASS — Air PO2=' + po2Air.toFixed(3) + ', EAN36 PO2=' + po2Ean.toFixed(3) + ', bestGas=tank ' + best;
        }
    },
    // ----------------------------------------------------------
    // TC-08: Trimix Deep Dive
    // ----------------------------------------------------------
    {
        id: 'TC-08',
        name: 'Trimix Deep Dive — Tx18/45 at 60m',
        fn: function() {
            setupDive([[0.18, 0.45, 200]]);
            api.setDepth(60);
            api.clearKeys();

            // Hold at 60m for 5 dive-minutes: 5*60/1.5 = 200 frames at dt=0.5
            for (var i = 0; i < 200; i++) {
                api.setDepth(60);
                api.updateDiving(0.5);
                if (api.gameState !== 'diving') {
                    return 'FAIL — Game ended during hold: ' + api.gameState + ' — ' + api.gameOverReason;
                }
            }

            // Validate He loading > 0
            var heLoaded = false;
            var tissHe = api.tissuesHe;
            for (var j = 0; j < 16; j++) {
                if (tissHe[j] > 0.01) { heLoaded = true; break; }
            }
            assert(heLoaded, 'He tissues should have loaded (> 0.01)');

            // N2 loading should be less than air-equivalent at 60m
            // Air at 60m: piN2 = (7 - 0.0627) * 0.79 ≈ 5.48
            // Tx18/45: fN2 = 1 - 0.18 - 0.45 = 0.37, piN2 = (7 - 0.0627) * 0.37 ≈ 2.57
            // Fast tissue (comp 0, ht=5min) should be near piN2 after 5 min
            var fastN2 = api.tissues[0];
            assert(fastN2 < 4.0, 'Fast tissue N2 on Tx18/45 should be < 4.0 (air would be ~5.5), got ' + fastN2.toFixed(2));

            var fastHe = tissHe[0];
            return 'PASS — After 5min at 60m on Tx18/45: N2[0]=' + fastN2.toFixed(2) + ', He[0]=' + fastHe.toFixed(2) + ' (He loading confirmed)';
        }
    },
    // ----------------------------------------------------------
    // TC-09: Safety Stop
    // ----------------------------------------------------------
    {
        id: 'TC-09',
        name: 'Safety Stop — triggered at 5m after 20m dive',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(20);
            api.clearKeys();

            // Hold at 20m for 5 dive-minutes: 5*60/1.5 = 200 frames at dt=0.5
            for (var i = 0; i < 200; i++) {
                api.setDepth(20);
                api.updateDiving(0.5);
                if (api.gameState !== 'diving') {
                    return 'FAIL — Game ended during hold: ' + api.gameState + ' — ' + api.gameOverReason;
                }
            }

            assert(api.maxDepth >= 20, 'maxDepth should be >= 20, got ' + api.maxDepth);

            // Move to 5m (safety stop zone: 4-6m)
            api.setDepth(5);
            // Run a few frames at 5m
            for (var j = 0; j < 10; j++) {
                api.setDepth(5);
                api.updateDiving(0.033);
            }

            assert(api.safetyStopNeeded === true, 'safetyStopNeeded should be true');

            return 'PASS — After 5min at 20m, moved to 5m: safetyStopNeeded=' + api.safetyStopNeeded + ', remaining=' + api.safetyStopRemaining.toFixed(0) + 's';
        }
    },
    // ----------------------------------------------------------
    // TC-10: Barotrauma — Forced rapid ascent
    // ----------------------------------------------------------
    {
        id: 'TC-10',
        name: 'Barotrauma — forced >18m/min ascent',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(50);
            api.clearKeys();
            // Run one frame to establish prevDepth
            api.updateDiving(0.033);

            // Force rapid ascent by manipulating depth between frames.
            // Each frame: set depth lower than previous, so updateDiving computes high ascentRate.
            // dt=0.033 real → dtDive = 0.099 sec = 0.00165 min
            // To get ascentRate > 18 m/min, need (prevDepth - newDepth) / 0.00165 > 18
            // → depth change > 0.0297 m/frame. Use 0.5m/frame → ascentRate ≈ 303 m/min
            var currentD = 50;
            var stepPerFrame = 0.5; // m per frame — massive ascent rate
            var triggered = false;

            for (var i = 0; i < 300; i++) {
                currentD = Math.max(0, currentD - stepPerFrame);
                api.setDepth(currentD);
                api.updateDiving(0.033);

                    triggered = true;
                    break;
                }
                if (currentD <= 0) break;
            }

            if (!triggered) {
                // Check if barotraumaTime accumulated even if not quite triggered
                var bt = api.barotraumaTime;
                // If we ran 100 frames at 0.5m/frame from 50m → reaching 0m in 100 frames

                return 'FAIL — Barotrauma not triggered. barotraumaTime=' + bt.toFixed(2) + ', ascentRate=' + api.ascentRate.toFixed(1);
            }

            assert(api.gameOverReason.indexOf('BAROTRAUMA') >= 0 || api.gameOverReason.indexOf('PNEUMOTHORAX') >= 0,
                'Reason should mention BAROTRAUMA/PNEUMOTHORAX, got: ' + api.gameOverReason);

    // ----------------------------------------------------------
    // TC-CCR-PO2-1: Bug #4 — deep CCR dive with junk OC tank does NOT falsely
    // trigger the generic O2 toxicity or hypoxia timers. In an active CCR
    // loop, calculatePO2() must report the loop's regulated PO2, not the
    // OC cylinder gas × ambient. Regression for issue #4.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-PO2-1',
        name: 'CCR #4 — 70m, SP 1.3, junk OC tank: no false O2-tox/hypoxia game over',
        fn: function() {
            // Deliberately fill tanks[0] with something whose fO2 * pAmb(70m)
            // would trip the OC toxicity check (0.21 × 8 = 1.68 > PO2_HIGH).
            // The bug allowed this to leak into calculatePO2() and end the dive.
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.ccrApplyDilPreset(2); // Tmx 15/45 — realistic deep diluent
            api.ccrState.targetSP = 1.3;
            api.ccrState.actualPO2 = 1.3; // loop already at setpoint
            api.setDepth(70);
            api.clearKeys();

            // Sanity: with the bug, activeGas().fO2 × pAmb(70m) = 0.21 × 8.0 = 1.68,
            // which is above PO2_HIGH (1.6) — that is exactly what used to drive
            // po2ViolationTime. After the fix, calculatePO2() must return the
            // loop PO2 (~1.3), safely below PO2_HIGH.
            var reportedPO2 = api.calculatePO2();
            assert(approx(reportedPO2, 1.3, 0.05),
                'calculatePO2() in active CCR loop must return actualPO2 (~1.3), got ' + reportedPO2);

            // Run ~40 dive-seconds at 70m; both PO2_TOXICITY_TIME (30s) and
            // ccrHyperoxiaTime (30s) would fire well within this window if
            // the bug were still present.
            for (var i = 0; i < 80; i++) {
                api.setDepth(70);
                // Keep the loop pinned at setpoint — the real solenoid model would
                // hold it there; we short-circuit it so the test isolates the PO2
                // *reporting* bug rather than the solenoid dynamics.
                api.ccrState.actualPO2 = 1.3;
                api.updateDiving(0.5); // 0.5 real → 1.5 dive-sec at 3x accel
                if (api.gameState === 'gameover') break;
            }
            assert(api.gameState !== 'gameover',
                'CCR loop holding at SP 1.3 must not trigger game over (got: ' + api.gameOverReason + ')');
            assert(api.po2ViolationTime < 5,
                'po2ViolationTime must stay near 0 with loop PO2 at 1.3, got ' + api.po2ViolationTime);
            assert(api.hypoxiaTime < 5,
                'hypoxiaTime must stay near 0 with loop PO2 at 1.3, got ' + api.hypoxiaTime);
            return 'PASS — CCR loop at 70m/SP1.3 does not falsely trigger generic PO2/hypoxia timers';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-NARC-1: Bug #50 — Air diluent produces higher narcosis / END
    // than Tmx 10/70 at the same depth. Regression for issue #50.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-NARC-1',
        name: 'CCR #50 — Air diluent END > Tmx 10/70 END at same depth',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.ccrState.targetSP = 1.3;
            api.ccrState.actualPO2 = 1.3;
            api.setDepth(70);

            // Air diluent (preset 0)
            api.ccrApplyDilPreset(0);
            var endAir = api.calculateEND();
            var narcAir = api.calculateNarcoticPP();

            // Tmx 10/70 diluent (preset 3) — helium-rich
            api.ccrApplyDilPreset(3);
            var endTmx = api.calculateEND();
            var narcTmx = api.calculateNarcoticPP();

            assert(endAir > endTmx + 5,
                'Air diluent END (' + endAir.toFixed(1) + ') must be substantially > Tmx 10/70 END (' + endTmx.toFixed(1) + ')');
            assert(narcAir > narcTmx + 0.5,
                'Air narcotic PP (' + narcAir.toFixed(2) + ') must be substantially > Tmx 10/70 narcotic PP (' + narcTmx.toFixed(2) + ')');
            return 'PASS — CCR narcosis/END respond to diluent choice (Air END=' +
                endAir.toFixed(1) + 'm, Tmx10/70 END=' + endTmx.toFixed(1) + 'm)';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-NARC-2: Bug #50 — mutating tanks[0] in active CCR loop must NOT
    // affect narcosis or END (the OC tank is not the breathing source).
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-NARC-2',
        name: 'CCR #50 — tanks[0] mutations do not affect narcosis/END in active loop',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.ccrApplyDilPreset(0); // Air diluent
            api.ccrState.targetSP = 1.3;
            api.ccrState.actualPO2 = 1.3;
            api.setDepth(70);

            var endBefore = api.calculateEND();
            var narcBefore = api.calculateNarcoticPP();

            // Mutate tanks[0] to a fictional helium-rich mix — this used to
            // reduce narcosis via the buggy getActiveTank() lookup.
            api.tanks[0].fO2 = 0.10;
            api.tanks[0].fHe = 0.90;
            api.tanks[0].fN2 = 0.00;

            var endAfter = api.calculateEND();
            var narcAfter = api.calculateNarcoticPP();

            assert(approx(endBefore, endAfter, 0.01),
                'END must be unaffected by tanks[0] mutation in CCR loop (before=' +
                endBefore.toFixed(2) + ', after=' + endAfter.toFixed(2) + ')');
            assert(approx(narcBefore, narcAfter, 0.001),
                'Narcotic PP must be unaffected by tanks[0] mutation in CCR loop (before=' +
                narcBefore.toFixed(3) + ', after=' + narcAfter.toFixed(3) + ')');
            return 'PASS — narcosis/END insensitive to tanks[0] in active CCR loop';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-NARC-3: Bug #50 — after bailout, narcosis/END must revert to
    // the OC diluent gas (via activeGas()), not stay on the loop mix.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-NARC-3',
        name: 'CCR #50 — bailout narcosis/END uses diluent gas (not stale loop mix)',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.ccrApplyDilPreset(3); // Tmx 10/70 — helium-rich diluent
            api.ccrState.targetSP = 1.3;
            api.ccrState.actualPO2 = 1.3;
            api.setDepth(70);

            // Loop-mode END: at 70m/SP1.3, inspired fHe ≈ 70/8 × 0.70 = 0.61 of inert
            var endLoop = api.calculateEND();

            // Trigger bailout — diver now breathes diluent directly (fHe = 0.70)
            api.ccrState.onBailout = true;

            var endBailout = api.calculateEND();
            var narcBailout = api.calculateNarcoticPP();

            // The diluent is Tmx 10/70 → fHe=0.70. Bailout must use activeGas()
            // (which returns diluent fractions in CCR-bailout), NOT the leftover
            // tanks[0] (air, fHe=0) that would give a much higher narcosis reading.
            var expectedNarc = (1 - 0.70) * (1 + 70 / 10); // = 0.30 × 8.0 = 2.4
            var expectedEnd  = Math.max(0, (70 + 10) * (1 - 0.70) - 10); // = 80×0.3 − 10 = 14
            assert(approx(narcBailout, expectedNarc, 0.05),
                'Bailout narcotic PP must reflect diluent fHe=0.70 (~' + expectedNarc.toFixed(2) +
                '), got ' + narcBailout.toFixed(2));
            assert(approx(endBailout, expectedEnd, 0.5),
                'Bailout END must reflect diluent fHe=0.70 (~' + expectedEnd.toFixed(1) +
                'm), got ' + endBailout.toFixed(1) + 'm');
            // Sanity: bailout END should be *lower* than loop END at the same depth,
            // because pure diluent has more He than the loop mix (which was diluted
            // by O2 titration up to SP).
            assert(endBailout < endLoop,
                'Bailout END (' + endBailout.toFixed(1) + ') should be < loop END (' +
                endLoop.toFixed(1) + ') for helium-rich diluent');
            return 'PASS — bailout narcosis/END correctly use diluent gas';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-DYN-1: Bug #25 — setpoint increase mid-dive raises actualPO2
    // AND costs O2 cylinder pressure beyond the constant metabolic draw.
    // Previously the solenoid correction was gas-balance-free.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-DYN-1',
        name: 'CCR #25 — setpoint increase consumes O2 proportional to the correction',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.setDepth(20); // pAmb = 3.0, held constant — isolate solenoid O2 cost
            api.ccrState.targetSP = 0.7;
            api.ccrState.actualPO2 = 0.7; // settled at old setpoint
            api.ccrState.o2CylPressure = 200;

            // Raise setpoint mid-dive — deficit becomes 0.6 bar.
            api.ccrState.targetSP = 1.3;

            // 20 x 1s ticks at constant depth (prevDepth === depth, no compression
            // term). po2ResponseRate = 0.05 bar/s -> max 1.0 bar of correction
            // capacity over 20s, comfortably enough to fully reach the 0.6 bar
            // deficit if O2 supply were unlimited (it is here: full cylinder).
            for (var i = 0; i < 20; i++) {
                api.updateCCRLoop(1, 20);
            }

            assert(approx(api.ccrState.actualPO2, 1.3, 0.05),
                'actualPO2 must reach the new setpoint (~1.3), got ' + api.ccrState.actualPO2.toFixed(3));

            // O2 cost of the 0.6 bar correction = loopVolume(6.0) * 0.6 = 3.6
            // surface liters -> 3.6 / o2CylVolume(2L) = 1.8 bar of cylinder
            // pressure. Plus 20s of metabolic draw: 0.8 L/min * (20/60 min) =
            // 0.267 L -> /2L = 0.133 bar. Total expected drop ~= 1.93 bar.
            var pressureDrop = 200 - api.ccrState.o2CylPressure;
            assert(pressureDrop > 1.0,
                'Setpoint correction must cost real O2 cylinder pressure (expected ~1.93 bar drop), got ' +
                pressureDrop.toFixed(2) + ' bar — metabolic-only draw alone would be ~0.13 bar');
            assert(approx(pressureDrop, 1.93, 0.2),
                'O2 cylinder pressure drop should match loopVolume*deficit + metabolic draw (~1.93 bar), got ' +
                pressureDrop.toFixed(2) + ' bar');
            return 'PASS — setpoint increase costs ' + pressureDrop.toFixed(2) + ' bar of O2, not just metabolic draw';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-DYN-2: Bug #25 — rapid descent produces a transient PO2 spike
    // that can exceed the hyperoxia threshold, even with the loop already
    // sitting at a moderate setpoint. This is the previously-dead
    // "Hyperoxia" game-over path (actualPO2 > 1.6 for 30s).
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-DYN-2',
        name: 'CCR #25 — rapid descent produces a transient hyperoxia-range PO2 spike',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.setDepth(6); // pAmb = 1.6, settled shallow
            api.ccrState.targetSP = 0.9;
            api.ccrState.actualPO2 = 0.9;
            api.ccrState.o2CylPressure = 200;

            // Instant rapid descent to 70m (pAmb = 8.0). Small dtSec (0.1s) keeps
            // the solenoid's own response-rate correction negligible (max 0.005
            // bar) so the assertion isolates the compression-scaling effect,
            // not the control loop reacting to it in the same tick.
            api.setDepth(70);
            api.updateCCRLoop(0.1, 6);

            // Expected: actualPO2 *= pAmb_new/pAmb_old = 0.9 * (8.0/1.6) = 4.5,
            // clamped only by pAmb (8.0) — well above both targetSP and the
            // CCR_SP_MAX / hyperoxia threshold of 1.6.
            assert(api.ccrState.actualPO2 > 1.6,
                'Rapid descent must produce a transient PO2 spike above the hyperoxia threshold (1.6), got ' +
                api.ccrState.actualPO2.toFixed(2));
            assert(approx(api.ccrState.actualPO2, 4.5, 0.3),
                'Expected actualPO2 ~= 4.5 (0.9 * 8.0/1.6) after the compression spike, got ' +
                api.ccrState.actualPO2.toFixed(2));
            return 'PASS — rapid descent spikes actualPO2 to ' + api.ccrState.actualPO2.toFixed(2) +
                ' (hyperoxia now reachable)';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-DYN-3: Bug #25 — rapid ascent produces a transient PO2 drop
    // below the hypoxia threshold, even with a completely full O2 cylinder.
    // Previously hypoxia was only reachable via an empty O2 tank.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-DYN-3',
        name: 'CCR #25 — rapid ascent produces a transient hypoxia-range PO2 drop despite full O2 tank',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.setDepth(90); // pAmb = 10.0
            api.ccrState.targetSP = 1.3;
            api.ccrState.actualPO2 = 1.3; // settled at setpoint
            api.ccrState.o2CylPressure = 200; // full O2 cylinder — bug #25 claimed hypoxia was unreachable while this holds

            // Instant rapid ascent to the surface (pAmb = 1.0). Small dtSec keeps
            // the solenoid's own correction negligible for the same reason as
            // TC-CCR-DYN-2.
            api.setDepth(0);
            api.updateCCRLoop(0.1, 90);

            // Expected: actualPO2 *= 1.0/10.0 = 0.13, clearly below PO2_HYPOXIA (0.16).
            assert(api.ccrState.actualPO2 < 0.16,
                'Rapid ascent must produce a transient PO2 drop below the hypoxia threshold (0.16), got ' +
                api.ccrState.actualPO2.toFixed(3));
            assert(api.ccrState.o2CylPressure > 195,
                'O2 cylinder must remain essentially full — hypoxia here comes from decompression, not gas supply, got ' +
                api.ccrState.o2CylPressure.toFixed(1) + ' bar');
            return 'PASS — rapid ascent drops actualPO2 to ' + api.ccrState.actualPO2.toFixed(3) +
                ' despite a full O2 cylinder (hypoxia now reachable)';

    },
    // ----------------------------------------------------------
    // TC-CCR-DYN-4: Bug #25 — with insufficient O2 reserve, the solenoid
    // cannot fully correct actualPO2 up to targetSP; it applies only what
    // the remaining cylinder can afford.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-DYN-4',
        name: 'CCR #25 — insufficient O2 reserve means setpoint is not fully reached',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.setDepth(20); // pAmb = 3.0, held constant
            api.ccrState.targetSP = 1.3;
            api.ccrState.actualPO2 = 0.5; // 0.8 bar deficit
            api.ccrState.o2CylVolume = 2; // liters
            api.ccrState.o2CylPressure = 1; // only 2 surface liters of O2 left

            // 20s tick: response-rate alone (0.05 * 20 = 1.0 bar) would be enough
            // to close the 0.8 bar deficit if O2 supply were unlimited — it is
            // NOT unlimited here, so the O2 mass-balance constraint must bind.
            api.updateCCRLoop(20, 20);

            assert(api.ccrState.actualPO2 < 1.2,
                'With an almost-empty O2 cylinder, actualPO2 must NOT fully reach targetSP (1.3), got ' +
                api.ccrState.actualPO2.toFixed(3));
            assert(api.ccrState.actualPO2 > 0.5,
                'actualPO2 should still rise partially with the O2 that was available, got ' +
                api.ccrState.actualPO2.toFixed(3));
            assert(api.ccrState.o2CylPressure < 0.05,
                'The O2 cylinder should be essentially drained by the partial correction, got ' +
                api.ccrState.o2CylPressure.toFixed(3) + ' bar');
            return 'PASS — insufficient O2 caps actualPO2 at ' + api.ccrState.actualPO2.toFixed(3) +
                ' instead of reaching setpoint for free';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-SETUP-1: Bug #5 — startDiveAction() must preserve the CCR
    // setup-screen configuration (diluent preset, setpoint, cylinder
    // sizes), not wipe it back to CCR_DEFAULTS via initCCR().
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-SETUP-1',
        name: 'CCR #5 — startDiveAction() preserves setup-configured values',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();

            // Configure away from CCR_DEFAULTS, as if on the setup screen.
            api.ccrApplyDilPreset(3); // Tmx 10/70
            api.ccrState.targetSP = 1.3;
            api.ccrAdjustO2Pres(-50); // 200 -> 150
            api.ccrAdjustDilVol(2);   // 3 -> 5

            var dilFO2Before = api.ccrState.dilFO2;
            var dilFHeBefore = api.ccrState.dilFHe;
            var spBefore = api.ccrState.targetSP;

            var dilVolBefore = api.ccrState.dilCylVolume;

            api.startDiveAction();

            assert(approx(api.ccrState.dilFO2, dilFO2Before, 0.001),
                'Diluent preset fO2 must survive startDiveAction(), before=' + dilFO2Before + ', after=' + api.ccrState.dilFO2);
            assert(approx(api.ccrState.dilFHe, dilFHeBefore, 0.001),
                'Diluent preset fHe must survive startDiveAction(), before=' + dilFHeBefore + ', after=' + api.ccrState.dilFHe);
            assert(approx(api.ccrState.targetSP, spBefore, 0.001),
                'Setpoint must survive startDiveAction(), before=' + spBefore + ', after=' + api.ccrState.targetSP);
            assert(approx(api.ccrState.o2CylPressure, o2PresBefore, 0.001),
                'O2 cylinder pressure must survive startDiveAction(), before=' + o2PresBefore + ', after=' + api.ccrState.o2CylPressure);
            assert(approx(api.ccrState.dilCylVolume, dilVolBefore, 0.001),
                'Diluent cylinder volume must survive startDiveAction(), before=' + dilVolBefore + ', after=' + api.ccrState.dilCylVolume);
            return 'PASS — CCR setup configuration (preset/SP/cylinder sizes) survives dive start';

    },
    // ----------------------------------------------------------
    // TC-CCR-POSTDIVE-1: Bug #24 — post-dive gas usage must be computed
    // from the O2/diluent cylinders (via the o2CylPressureStart /
    // dilCylPressureStart snapshot taken in resetDive()), not from the
    // untouched OC tank left over from a previous mode.
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-POSTDIVE-1',
        name: 'CCR #24 — post-dive gas usage reflects O2/diluent cylinders',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.ccrState.o2CylPressure = 200;
            api.ccrState.dilCylPressure = 200;
            api.ccrState.o2CylVolume = 2;
            api.ccrState.dilCylVolume = 3;

            api.startDiveAction(); // must snapshot o2/dilCylPressureStart = 200/200

            assert(approx(api.ccrState.o2CylPressureStart, 200, 0.001),
                'o2CylPressureStart must snapshot the configured starting pressure, got ' +
                api.ccrState.o2CylPressureStart);
            assert(approx(api.ccrState.dilCylPressureStart, 200, 0.001),
                'dilCylPressureStart must snapshot the configured starting pressure, got ' +
                api.ccrState.dilCylPressureStart);

            // Simulate consumption during the dive.
            api.ccrState.o2CylPressure = 180;  // (200-180) * 2L = 40L used
            api.ccrState.dilCylPressure = 190; // (200-190) * 3L = 30L used

            var o2Used = (api.ccrState.o2CylPressureStart - api.ccrState.o2CylPressure) * api.ccrState.o2CylVolume;
            var dilUsed = (api.ccrState.dilCylPressureStart - api.ccrState.dilCylPressure) * api.ccrState.dilCylVolume;
            assert(approx(o2Used, 40, 0.1), 'Expected 40L O2 used, got ' + o2Used.toFixed(1));
            assert(approx(dilUsed, 30, 0.1), 'Expected 30L diluent used, got ' + dilUsed.toFixed(1));
            return 'PASS — CCR post-dive gas usage: O2 used=' + o2Used.toFixed(0) +
                'L, diluent used=' + dilUsed.toFixed(0) + 'L (computed from cylinders, not the OC tank)';
        }
    },
    // ----------------------------------------------------------
    // TC-CCR-DIL-1: Bug #8 — updateCCRDiluent() overestimated consumption
    // by a factor of p2/p1. Descent 0->30m must consume exactly
    // loopVolume * 3 surface liters of diluent, not loopVolume * 3 * 4
    // (the old formula's p2/p1 = 4.0/1.0 = 4x factor at this depth).
    // ----------------------------------------------------------
    {
        id: 'TC-CCR-DIL-1',
        name: 'CCR #8 — descent 0->30m consumes loopVolume*3 surface liters of diluent',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.diveMode = 'ccr';
            api.initCCR();
            api.ccrState.dilCylPressure = 200;
            api.ccrState.dilCylVolume = 3;
            api.ccrState.loopVolume = 6.0;

            var pressureBefore = api.ccrState.dilCylPressure;
            api.updateCCRDiluent(0, 30);
            var pressureAfter = api.ccrState.dilCylPressure;

            // Expected: loopVolume * (p2-p1) = 6.0 * (4.0-1.0) = 18 surface
            // liters -> 18 / dilCylVolume(3) = 6 bar drop. The old buggy
            // formula would have produced loopVolume*(p2-p1)*p2/p1 =
            // 18*4.0 = 72L -> 24 bar drop, 4x too much at this depth.
            var expectedDrop = 6.0;
            var actualDrop = pressureBefore - pressureAfter;
            assert(approx(actualDrop, expectedDrop, 0.1),
                'Descent 0->30m should consume loopVolume*3=18L diluent (6 bar drop at 3L cylinder), got ' +
                actualDrop.toFixed(2) + ' bar drop');
            return 'PASS — 0->30m descent consumed ' + actualDrop.toFixed(2) + ' bar of diluent (expected 6.00)';
        }
    },
    // ----------------------------------------------------------
    // Issue #52 — Visual Surface Layer
    // ----------------------------------------------------------
    {
        id: 'TC-52-DETERMINISM',
        name: 'Issue #52 — visualProfileDepth is deterministic',
        fn: function() {
            // Same inputs → same outputs, every call.
            var sites = ['shore', 'reef', 'cave'];
            var kinds = ['floor', 'ceiling'];
            var xs = [-15, 0, 12.5, 47.3, 88, 121.7, 175];
            var mismatches = 0;
            for (var i = 0; i < sites.length; i++) {
                for (var k = 0; k < kinds.length; k++) {
                    for (var j = 0; j < xs.length; j++) {
                        var a = api.visualProfileDepth(sites[i], kinds[k], xs[j], 30);
                        var b = api.visualProfileDepth(sites[i], kinds[k], xs[j], 30);
                        var c = api.visualProfileDepth(sites[i], kinds[k], xs[j], 30);
                        if (a !== b || b !== c) mismatches++;
                    }
                }
            }
            assert(mismatches === 0, mismatches + ' non-deterministic samples');
            // And the noise helper itself:
            var n1 = api.visualSurfaceNoise(12.5, 11.31);
            var n2 = api.visualSurfaceNoise(12.5, 11.31);
            assert(n1 === n2, 'visualSurfaceNoise not deterministic');
            return 'PASS — deterministic across ' + (sites.length * kinds.length * xs.length) + ' samples';
        }
    },
    {
        id: 'TC-52-AMPLITUDE',
        name: 'Issue #52 — visual offset stays within configured amplitude',
        fn: function() {
            var cfg = api.VISUAL_SURFACE_CONFIG;
            var testCases = [
                { site: 'shore', kind: 'floor',   amp: cfg.shore.floorAmp },
                { site: 'reef',  kind: 'floor',   amp: cfg.reef.floorAmp },
                { site: 'cave',  kind: 'floor',   amp: cfg.cave.floorAmp },
                { site: 'cave',  kind: 'ceiling', amp: cfg.cave.ceilAmp }
            ];
            var collision = 30;
            var maxAbs = 0;
            for (var t = 0; t < testCases.length; t++) {
                var tc = testCases[t];
                // dense sweep across a wide world-x range
                for (var x = -50; x <= 200; x += 0.25) {
                    var v = api.visualProfileDepth(tc.site, tc.kind, x, collision);
                    var off = v - collision;
                    // Direction check: floor offset ≤ 0, ceiling offset ≥ 0
                    if (tc.kind === 'floor' && off > 1e-9) {
                        throw new Error(tc.site + '/floor offset >0 at x=' + x + ': ' + off);
                    }
                    if (tc.kind === 'ceiling' && off < -1e-9) {
                        throw new Error(tc.site + '/ceiling offset <0 at x=' + x + ': ' + off);
                    }
                    var mag = Math.abs(off);
                    if (mag > tc.amp + 1e-9) {
                        throw new Error(tc.site + '/' + tc.kind + ' |offset|=' + mag.toFixed(4) +
                                        ' exceeds amp=' + tc.amp + ' at x=' + x);
                    }
                    if (mag > maxAbs) maxAbs = mag;
                }
            }
            return 'PASS — largest |offset|=' + maxAbs.toFixed(3) + ' m, all within budget';
        }
    },
    {
        id: 'TC-52-FLOOR-INVARIANT',
        name: 'Issue #52 — visual floor ≤ collision floor (no invisible walls)',
        fn: function() {
            api.diveSite = 'shore';
            var sites = ['shore', 'reef', 'cave'];
            var breaches = 0;
            for (var s = 0; s < sites.length; s++) {
                api.diveSite = sites[s];
                for (var x = -30; x <= 200; x += 0.5) {
                    var col = api.floorAt(x);
                    var vis = api.visualProfileDepth(sites[s], 'floor', x, col);
                    if (vis > col + 1e-9) breaches++;
                }
            }
            assert(breaches === 0, breaches + ' floor invariant breaches');
            return 'PASS — floor invariant holds across shore/reef/cave';
        }
    },
    {
        id: 'TC-52-CEILING-INVARIANT',
        name: 'Issue #52 — visual ceiling ≥ collision ceiling (Cave)',
        fn: function() {
            api.diveSite = 'cave';
            var breaches = 0;
            var samples = 0;
            for (var x = -10; x <= 200; x += 0.5) {
                var col = api.ceilingAt(x);
                if (col <= 0.01) continue;  // open shaft — no ceiling to test
                var vis = api.visualProfileDepth('cave', 'ceiling', x, col);
                samples++;
                if (vis < col - 1e-9) breaches++;
            }
            assert(samples > 0, 'no ceiling samples found');
            assert(breaches === 0, breaches + ' ceiling invariant breaches');
            return 'PASS — ceiling invariant holds across ' + samples + ' samples';
        }
    },
    {
        id: 'TC-52-COLLISION-UNCHANGED',
        name: 'Issue #52 — floorAt/ceilingAt values unchanged by this issue',
        fn: function() {
            // Reference values captured from the collision profiles as of
            // release/batch-2 baseline. If any of these change, the collision
            // geometry was accidentally touched.
            api.diveSite = 'shore';
            assert(Math.abs(api.floorAt(0)   -  3) < 1e-6, 'shore floorAt(0)');
            assert(Math.abs(api.floorAt(35)  -  6) < 1e-6, 'shore floorAt(35)');
            assert(Math.abs(api.floorAt(70)  - 10) < 1e-6, 'shore floorAt(70)');
            assert(Math.abs(api.floorAt(115) - 22) < 1e-6, 'shore floorAt(115)');

            api.diveSite = 'reef';
            assert(Math.abs(api.floorAt(-8)  -  5) < 1e-6, 'reef floorAt(-8)');
            assert(Math.abs(api.floorAt(0)   -  5) < 1e-6, 'reef floorAt(0)');
            assert(Math.abs(api.floorAt(8)   -  5) < 1e-6, 'reef floorAt(8)');
            assert(Math.abs(api.floorAt(20)  - 90) < 1e-6, 'reef floorAt(20)');

            api.diveSite = 'cave';
            assert(Math.abs(api.floorAt(0)    - 10)  < 1e-6, 'cave floorAt(0)');

    {
        id: 'TC-52-WORLD-ANCHORED',
        name: 'Issue #52 — visual contour is world-anchored (not camera-relative)',
        fn: function() {
            // Same worldX must give same visualD regardless of any external
            // state: setting diverX / depth to different values must NOT
            // change the noise. The function is pure of its args.
            var beforeX = api.diverX, beforeD = api.depth;
            var samples = [];
            for (var x = -20; x <= 150; x += 3.7) {
                samples.push(api.visualProfileDepth('reef', 'floor', x, 30));
            }
            api.diverX = 500;
            api.setDepth(80);
            var mismatches = 0;
            for (var i = 0, x2 = -20; x2 <= 150; x2 += 3.7, i++) {
                var v = api.visualProfileDepth('reef', 'floor', x2, 30);
                if (v !== samples[i]) mismatches++;
            }
            // restore
            api.diverX = beforeX;
            api.setDepth(beforeD);
            assert(mismatches === 0, mismatches + ' samples changed with camera position');
            return 'PASS — visualProfileDepth is a pure function of its arguments';
        }
    },
    {
        id: 'TC-52-NOT-MIRROR',
        name: 'Issue #52 — Cave floor and ceiling use different seeds',
        fn: function() {
            // If floor and ceiling shared the same seed, the offsets would
            // mirror each other. Sample several xs and check the two offset
            // sequences are not simply proportional / identical in shape.
            var xs = [10, 20, 30, 40, 55, 70, 85, 100, 115, 130];
            var floorOffsets = [], ceilOffsets = [];
            for (var i = 0; i < xs.length; i++) {
                floorOffsets.push(api.visualProfileDepth('cave', 'floor', xs[i], 30) - 30);
                ceilOffsets.push(api.visualProfileDepth('cave', 'ceiling', xs[i], 30) - 30);
            }
            // Check they aren't identical (or trivially negated) at every point
            var identical = 0, negated = 0;
            for (var j = 0; j < xs.length; j++) {
                if (Math.abs(floorOffsets[j] - ceilOffsets[j]) < 1e-6) identical++;
                if (Math.abs(floorOffsets[j] + ceilOffsets[j]) < 1e-6) negated++;
            }
            assert(identical < xs.length, 'floor and ceiling offsets are identical everywhere');
            assert(negated   < xs.length, 'floor and ceiling offsets are mirror-negated everywhere');
            return 'PASS — floor/ceiling have independent noise (identical=' + identical +
                   ', negated=' + negated + ' of ' + xs.length + ')';
        }
    },

        name: 'Issue #34 — drawContactBand is a safe no-op for degenerate inputs',
        fn: function() {
            var cvs = document.createElement('canvas');

            var cx = cvs.getContext('2d');
            cx.fillStyle = '#ffffff';
            cx.fillRect(0, 0, 10, 10);
            var cfg = api.CONTACT_AO.terrain;
            var before = cx.getImageData(0, 0, 1, 1).data;

            api.drawContactBand(cx, null, cfg);
            var after = cx.getImageData(0, 0, 1, 1).data;
            for (var c = 0; c < 4; c++) {
                assert(before[c] === after[c],

    {
        id: 'TC-54-BLEND-CONTINUITY',
        name: 'Issue #54 — visibility changes monotonically and continuously across a blend margin',
        fn: function() {
            // Zone blend=4, so the soft margin is 4 m from any edge.
            // Sample at 5 positions crossing into the zone along x (from x=-2 to x=2),
            // with the zone starting at x=0. depth=10 is well inside d-range.
            var scratch = {
                visualZones: [
                    { id: 'soft', x1: 0, x2: 20, d1: 0, d2: 20, priority: 0, blend: 4 }
                ],
                atmosphereProfiles: {
                    soft: { visibility: 0.5 }  // 0.5 inside, 1.0 outside → deviation = 0.5
                }
            };
            // Sample 5 points at x=0 (edge), 1, 2, 3, 4 (core). depth=10 is
            // well inside d-range so the blend factor only depends on x.
            var xs = [0, 1, 2, 3, 4];
            var vals = [];
            for (var i = 0; i < xs.length; i++) {
                var a = api.sampleLocalAtmosphere(scratch, xs[i], 10);
                vals.push(a.visibility);
            }
            // visibility should decrease (or stay equal) as we move further inside
            // (blend weight increases → profile value takes over → vis decreases toward 0.5).
            for (var j = 1; j < vals.length; j++) {
                assert(vals[j] <= vals[j - 1] + 0.001,
                    'visibility should be monotonically non-increasing going into the zone; got '
                    + vals[j - 1].toFixed(4) + ' then ' + vals[j].toFixed(4) + ' at x=' + xs[j]);
            }
            // Max step between adjacent samples must be less than half the total deviation.
            var totalDeviation = Math.abs(vals[0] - vals[vals.length - 1]);
            for (var k = 1; k < vals.length; k++) {
                var step = Math.abs(vals[k] - vals[k - 1]);
                assert(step < totalDeviation / 2,
                    'discontinuous jump between x=' + xs[k - 1] + ' and x=' + xs[k]
                    + ': step=' + step.toFixed(4) + ', totalDeviation=' + totalDeviation.toFixed(4));
            }
            return 'PASS — visibility changes smoothly across blend margin; samples: '
                + vals.map(function(v) { return v.toFixed(3); }).join(', ');
        }

    {
        id: 'TC-55-WRECK-INTERIOR-DECKS-PRODUCE-CANDIDATES',
        name: 'Issue #55 — wreck interior-deck rules anchor to the correct deck, not just the first one found',
        fn: function() {

            try {

                var cands = api.sampleSetDressingCandidates(site, 0, 180);

                var vehicle = cands.filter(function(c) { return c.ruleId === 'wreck_vehicle_deck_debris'; });

                assert(vehicle.length > 0, 'wreck_vehicle_deck_debris produced 0 candidates (deck-anchoring regression)');
                assert(engine.length > 0, 'wreck_engine_room_debris produced 0 candidates (deck-anchoring regression)');

                // Depth sanity: candidates must sit within their own zone's
                // depth band (28..40 for vehicle deck, 53..62 for engine
                // room), not at the seabed (d=66) or some other deck's depth.
                var vehicleZone = site.visualZones.filter(function(z) { return z.id === 'wreck_vehicle_deck'; })[0];
                var engineZone  = site.visualZones.filter(function(z) { return z.id === 'wreck_engine_room'; })[0];

                    assert(vehicle[i].depth >= vehicleZone.d1 && vehicle[i].depth <= vehicleZone.d2,
                        'vehicle deck candidate depth ' + vehicle[i].depth + ' outside zone band [' + vehicleZone.d1 + ',' + vehicleZone.d2 + ']');
                }
                for (var j = 0; j < engine.length; j++) {
                    assert(engine[j].depth >= engineZone.d1 && engine[j].depth <= engineZone.d2,
                        'engine room candidate depth ' + engine[j].depth + ' outside zone band [' + engineZone.d1 + ',' + engineZone.d2 + ']');

                return 'PASS — vehicle deck: ' + vehicle.length + ' candidates, engine room: ' + engine.length + ' candidates, both correctly depth-anchored';
            } finally {
                api.diveSite = savedSite;
            }
        }

        name: 'Issue #33 — polygon is a strict superset of the old 3-rect union',
        fn: function() {
            // For every 1m grid point inside any old rectangle, that point
            // must be inside the polygon. This is the collision-safety
            // guarantee: drawing steel via the polygon clip never opens a
            // gap where the old union used to be steel.
            var rects = api.wreckSilhouetteRects();
            var poly = api.wreckSilhouettePolygon();
            assert(rects.length === 3, 'expected 3 rects, got ' + rects.length);
            assert(poly.length >= 8, 'expected polygon with ≥8 vertices, got ' + poly.length);
            // point-in-polygon (ray casting, y-down convention same as canvas)
            function inPoly(px, py) {
                var inside = false;
                for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                    var xi = poly[i][0], yi = poly[i][1];
                    var xj = poly[j][0], yj = poly[j][1];
                    var intersects = ((yi > py) !== (yj > py))
                        && (px < (xj - xi) * (py - yi) / (yj - yi + 1e-12) + xi);
                    if (intersects) inside = !inside;
                }
                return inside;
            }
            var missed = [];
            for (var r = 0; r < rects.length; r++) {
                var rect = rects[r];
                for (var x = rect[0] + 0.5; x < rect[1]; x += 1) {
                    for (var d = rect[2] + 0.5; d < rect[3]; d += 1) {
                        if (!inPoly(x, d)) missed.push([x.toFixed(1), d.toFixed(1), r]);
                        if (missed.length > 8) break;
                    }
                    if (missed.length > 8) break;
                }
                if (missed.length > 8) break;
            }
            assert(missed.length === 0,
                'polygon does NOT enclose old-union point(s): ' + JSON.stringify(missed));
            return 'PASS — every grid point in the 3-rect union sits inside the ferry polygon';

                    var p = prof[zid];
                    function check(label, val, range) {
                        if (val == null) return;
                        if (val < range.min || val > range.max) {
                            problems.push(siteIds[i] + '.' + zid + '.' + label + '=' + val + ' outside [' + range.min + ',' + range.max + ']');

                    check('visibility', p.visibility, CLAMP.visibility);

    {
        id: 'TC-65-PHYSICS-SUBSTEP-STABILITY',
        name: 'Issue #65 — physics substepping keeps velocities bounded at large frame dt',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            api.setDepth(20);
            var FP = api.FINKICK_PARAMS;
            var BP = api.BUOYANCY_PARAMS;

            // Baseline: many small steps summing to 3s of simulated physics.
            // At dtSec=3s the raw single-call integrators would flip
            // velocity sign every step (drag factor = FP.dragCoefficient*3
            // exceeds 1). The substep-driven caller must produce a bounded,
            // sensible result close to the small-step reference.
            api.horizontalVelocity = 0.3; // seed a modest speed
            api.verticalVelocity = 0;
            api.setDepth(20);
            api.bcdGasSurfaceLiters = 4;
            var kickDir = 1;
            var totalSec = 3.0;
            var smallStep = 0.02;
            var nSmall = Math.round(totalSec / smallStep);
            for (var i = 0; i < nSmall; i++) {
                api.updateBuoyancyPhysics(smallStep);
                api.updateHorizontalPhysics(smallStep, kickDir);
            }
            var hRefSmall = api.horizontalVelocity;
            var vRefSmall = api.verticalVelocity;

            // Now do the same 3s of physics but through the substep-driven
            // caller (one dtDiveSeconds=3 "frame"). Reset first.
            api.horizontalVelocity = 0.3;
            api.verticalVelocity = 0;
            api.setDepth(20);
            api.bcdGasSurfaceLiters = 4;
            // Emulate the game-loop substep loop directly to isolate the fix.
            var remaining = 3.0;
            var CAP = api.PHYSICS_MAX_SUBSTEP_SEC;
            while (remaining > 1e-9) {
                var step = remaining > CAP ? CAP : remaining;
                api.updateBuoyancyPhysics(step);
                api.updateHorizontalPhysics(step, kickDir);
                remaining -= step;
            }
            var hSubstep = api.horizontalVelocity;
            var vSubstep = api.verticalVelocity;

            // 1) Substep results must be bounded / sane.
            assert(isFinite(hSubstep) && isFinite(vSubstep),
                'substep velocities must be finite (h=' + hSubstep + ', v=' + vSubstep + ')');
            assert(Math.abs(hSubstep) <= FP.maxSpeed + 0.01,
                'substep horizontal speed must respect maxSpeed clamp (got ' + hSubstep + ', max ' + FP.maxSpeed + ')');
            var maxV = Math.max(BP.maxAscentRate, BP.maxDescentRate);
            assert(Math.abs(vSubstep) <= maxV + 0.01,
                'substep vertical speed must respect the ascent/descent clamps (got ' + vSubstep + ')');

            // 2) Substep and small-step reference must converge — not diverge
            // wildly. Explicit Euler even at 0.1s dt isn't identical to 0.02s
            // dt, but they should be in the same neighbourhood. A generous
            // tolerance suffices to catch the sign-flipping failure mode.
            assert(Math.sign(hSubstep) === Math.sign(hRefSmall) || (Math.abs(hSubstep) < 0.05 && Math.abs(hRefSmall) < 0.05),
                'substep horizontal velocity should not diverge in sign from small-step reference (substep=' + hSubstep.toFixed(3) + ', ref=' + hRefSmall.toFixed(3) + ')');
            assert(Math.abs(hSubstep - hRefSmall) < 0.4,
                'substep vs small-step horizontal velocities should be close: substep=' + hSubstep.toFixed(3) + ', ref=' + hRefSmall.toFixed(3));

            // 3) Direct sanity check the failure mode CAN'T reappear: at
            // dt=3s with the OLD single-call integrator the drag factor is
            // FP.dragCoefficient*3 which exceeds 1, so velocity flips sign.
            // With substepping every per-step drag factor is <= 0.1 * FP.dragCoefficient.
            assert(CAP * FP.dragCoefficient < 1,
                'PHYSICS_MAX_SUBSTEP_SEC must keep per-step horizontal drag factor below 1 (got ' + (CAP * FP.dragCoefficient) + ')');
            assert(CAP * BP.dragCoefficient < 1,
                'PHYSICS_MAX_SUBSTEP_SEC must keep per-step buoyancy drag factor below 1 (got ' + (CAP * BP.dragCoefficient) + ')');

            return 'PASS — substep: h=' + hSubstep.toFixed(3) + '/v=' + vSubstep.toFixed(3)
                + '; small-step ref: h=' + hRefSmall.toFixed(3) + '/v=' + vRefSmall.toFixed(3);
        }
    },
    {
        id: 'TC-69-FRAMERATE-INDEPENDENT-PROBABILITY',
        name: 'Issue #69 — perSecondToPerFrameProbability keeps event counts equal across framerates',
        fn: function() {
            var f = api.perSecondToPerFrameProbability;
            assert(typeof f === 'function', 'perSecondToPerFrameProbability must be exposed on gameAPI');
            // Boundary/identity cases
            assert(f(0, 1/60) === 0, 'p=0 should stay 0');
            assert(f(1, 1/60) === 1, 'p=1 should stay 1');
            assert(f(0.15, 0) === 0, 'dt=0 should yield 0 (no frame time = no chance of event)');
            // A 60fps input frame reproduces the calibration probability.
            assert(Math.abs(f(0.15, 1/60) - 0.15) < 1e-9,
                'at dt=1/60 the result should equal p60 (identity), got ' + f(0.15, 1/60));

            // Statistical: draw N frames at 60 fps vs 144 fps for the same
            // total real-time window. The expected number of events per
            // real second should stay constant across framerates. Use a
            // modestly small p60 so the linear approximation p60*60 events/s
            // is a valid target — with p60 = 0.15 the per-frame probability
            // saturates at low framerates (1-0.85^6 ≈ 0.62 at 10 fps caps
            // at 10 events/s vs the ~9 events/s calibration target, so a
            // 10-fps sample would be biased low regardless of the fix).
            function countEvents(dtReal, totalSec, p60) {
                var frames = Math.round(totalSec / dtReal);
                var p = f(p60, dtReal);
                var events = 0;
                for (var i = 0; i < frames; i++) {
                    if (Math.random() < p) events++;
                }
                return events;
            }
            var TOTAL = 40; // seconds of simulated real time — bigger N = tighter σ
            var P60 = 0.03;
            var e60  = countEvents(1/60,  TOTAL, P60);
            var e144 = countEvents(1/144, TOTAL, P60);
            // Expected exact rate: -60 * ln(1 - p60) events/sec ≈ 1.83/sec.
            // Over 40s → ≈73 events. sqrt(73) ≈ 8.5 → generous ±25 window
            // (≈3σ) catches genuine breakage but tolerates one-run variance.
            var expected = -60 * Math.log(1 - P60) * TOTAL; // ≈ 73
            assert(Math.abs(e60 - expected) < 25,
                '60 fps event count should be near ' + expected.toFixed(1) + ' (±25), got ' + e60);
            assert(Math.abs(e144 - expected) < 25,
                '144 fps event count should be near ' + expected.toFixed(1) + ' (±25), got ' + e144);
            assert(Math.abs(e60 - e144) < 30,
                'event counts across framerates should be close, got 60fps=' + e60 + ', 144fps=' + e144);

            return 'PASS — 60fps=' + e60 + ', 144fps=' + e144 + ' (expected ≈' + expected.toFixed(1) + ')';
        }
    },
    {
        id: 'TC-71-PROFILE-SAMPLE-CATCH-UP',
        name: 'Issue #71 — profile sampler catches every 2 s boundary crossed under large dt',
        fn: function() {
            setupDive([[0.21, 0, 200]]);
            // Descend gently to a stable non-shallow depth so updateDiving()'s
            // ">0.5m gate" fires every frame and the various game-over checks
            // stay clean at the huge dtDiveSeconds values this test drives.
            api.setDepth(10);
            api.diveProfile.length = 0;
            api._profileSampleTimer = 0;
            api.maxDepth = 20;

            // Run several fast-forward-style large-dt frames. dtReal=0.4 with
            // TIME_ACCELERATION=3 yields dtDiveSeconds=1.2 per frame — small
            // enough to keep updateDiving()'s gameover checks clean, but
            // large enough that some frames cross a 2s boundary and others
            // don't, exercising the "catch every boundary crossed" fix
            // rather than "one per frame". A few frames will cross zero
            // boundaries and a few will cross two, mirroring the fast-
            // forward failure mode #71 describes.
            var FRAME_DT_REAL = 0.4;   // → dtDiveSeconds = 1.2 with TIME_ACCEL=3
            var N_FRAMES = 60;
            var startProfileLen = api.diveProfile.length;
            var startDiveTime = api.diveTime;
            var actualFrames = 0;
            for (var i = 0; i < N_FRAMES; i++) {
                api.setDepth(10); // hold depth so the ">0.5m" gate always fires
                api.updateDiving(FRAME_DT_REAL);
                actualFrames++;
                if (api.gameState !== 'diving') break;
            }
            assert(actualFrames >= N_FRAMES,
                'test needs all ' + N_FRAMES + ' frames to run (gameover=' + api.gameOverReason + '), only ran ' + actualFrames);
            var endDiveTime = api.diveTime;
            var samples = api.diveProfile.slice(startProfileLen);
            var simSecs = (endDiveTime - startDiveTime) * 60;
            // Expected samples: ~simSecs / 2, ± one boundary (rounding).
            var expected = Math.floor(simSecs / 2);
            assert(samples.length >= expected - 1 && samples.length <= expected + 1,
                'expected ~' + expected + ' samples over ' + simSecs.toFixed(2) + ' sim-seconds, got ' + samples.length);

            // Sample spacing check: consecutive samples should be ~2 sim-
            // seconds apart in dive-time. Convert diveTime (minutes) to
            // seconds for the check.
            var maxGapErr = 0;
            for (var j = 1; j < samples.length; j++) {
                var gapSec = (samples[j].t - samples[j - 1].t) * 60;
                var err = Math.abs(gapSec - 2);
                if (err > maxGapErr) maxGapErr = err;
            }
            assert(maxGapErr < 0.05,
                'consecutive-sample spacing should be ~2 sim-seconds; worst gap error = ' + maxGapErr.toFixed(4) + 's');

            // Sanity: none of the caught-up samples should share an
            // identical timestamp (the "one sample per boundary" fix must
            // produce distinct t values within a single frame's catch-up).
            for (var k = 1; k < samples.length; k++) {
                assert(samples[k].t > samples[k - 1].t,
                    'sample timestamps must be strictly increasing; found duplicate/regression at index ' + k);
            }

            // Direct catch-up test — bypass updateDiving() and drive the
            // sampler math directly at an extreme dtDiveSeconds so we
            // exercise the multi-boundary-crossing case explicitly. Old
            // "if" variant would emit exactly one sample here; the new
            // while loop must emit three.
            api.diveProfile.length = 0;
            api._profileSampleTimer = 0;
            var beforeT = api.diveTime;
            var beforeLen = api.diveProfile.length;
            // Emulate the exact sampler block from updateDiving at
            // dtDiveSeconds=6 (past three 2-s boundaries).
            api._profileSampleTimer = api._profileSampleTimer + 6;
            var pushed = 0;
            while (api._profileSampleTimer >= 2) {
                api._profileSampleTimer = api._profileSampleTimer - 2;
                var sT = beforeT - api._profileSampleTimer / 60;
                api.diveProfile.push({ t: sT, depth: 10, ceiling: 0 });
                pushed++;
            }
            assert(pushed === 3, 'a 6s frame must produce exactly 3 caught-up samples, got ' + pushed);
            var caughtUp = api.diveProfile.slice(beforeLen);
            for (var m = 1; m < caughtUp.length; m++) {
                var gap2 = (caughtUp[m].t - caughtUp[m - 1].t) * 60;
                assert(Math.abs(gap2 - 2) < 0.001,
                    'caught-up samples must be spaced exactly 2 sim-sec apart, got gap ' + gap2);
            }

            return 'PASS — updateDiving path: ' + samples.length + ' samples over ' + simSecs.toFixed(1)
                + ' sim-seconds, max gap error ' + maxGapErr.toFixed(4) + 's; '
                + 'direct-drive: ' + pushed + ' samples caught up in one 6s frame';
        }
    },

    // ==========================================================
    // Issue #38 — contextual onboarding hints (one-time, edge-triggered)
    // ==========================================================
    // Shared helper mirroring the TC-66 save/restore pattern: back up every
    // localStorage key that touches the hint namespace, wipe it, and restore
    // the whole snapshot afterwards. Tests need to exercise "first-time"
    // behaviour repeatedly, and the harness must never leak state between

    {
        id: 'TC-38-BCD-FIRST-DEPTH-QUEUES-HINT',
        name: 'Issue #38 — first descent past 2m enqueues the BCD hint exactly once',
        fn: function() {
            api.resetAllHintsForTests();
            setupDive([[0.21, 0, 200]]);
            // Depth 0 → below the 2m gate, must NOT trigger.
            api.setDepth(0);
            api.updateDiving(0.033);
            assert(!api.hintEdges.bcd, 'BCD edge must stay false at depth 0');
            // Cross the 2m gate — hint should enqueue.
            api.setDepth(3);
            api.updateDiving(0.033);
            assert(api.hintEdges.bcd, 'BCD edge should latch true after depth > 2m');
            var pendingOrShown = (api.hintQueue.length + (api.hintNotifyTime > 0 ? 1 : 0));
            assert(pendingOrShown === 1,
                'exactly one BCD hint should be pending/shown, got queue=' + api.hintQueue.length + ' time=' + api.hintNotifyTime);
            // A second frame at depth must NOT enqueue again.
            api.updateDiving(0.033);
            var stillOne = (api.hintQueue.length + (api.hintNotifyTime > 0 ? 1 : 0));
            assert(stillOne === 1, 'BCD hint must not re-enqueue while edge is latched, got ' + stillOne);
            return 'PASS — BCD edge fires exactly once when depth first crosses 2m';
        }
    },

    {
        id: 'TC-38-NDL-TRIGGER-FIRES-ONCE',
        name: 'Issue #38 — NDL trigger fires when NDL drops below 10 min',
        fn: function() {
            api.resetAllHintsForTests();
            // diveMode and diveSite must both be pinned before setupDive() —
            // neither is reset by resetDive() (diveSite by design, per its
            // own comment in state.js), so a prior test in the suite leaving
            // diveMode='ccr' or diveSite='cave' would break this test: an
            // OC-shaped tank setup under CCR logic behaves nonsensically,
            // and setDepth(30) against a shallow leaked site's floor (e.g.
            // cave's floor is 10m at x=0) gets clamped back by the physics
            // integrator every tick, producing a false ~800 m/min "ascent"
            // that trips a barotrauma game-over within a handful of ticks.
            api.diveMode = 'rec';
            api.diveSite = 'open';
            setupDive([[0.21, 0, 200]]);
            // Hold at 30m for long enough to drop NDL below 10 min.
            // At dt=0.5 real → 1.5 dive-sec/frame, ~20 min of dive-time is
            // plenty to breach the NDL_MIN threshold.
            var fired = false;
            for (var i = 0; i < 900; i++) {
                api.setDepth(30);
                api.updateDiving(0.5);
                if (api.hintEdges.ndl) { fired = true; break; }
                if (api.gameState !== 'diving') break;
            }
            assert(fired, 'NDL edge should latch once NDL crosses below ' + api.HINT_NDL_MIN + ' min, got gameState=' + api.gameState + ' gameOverReason=' + api.gameOverReason);
            var win = document.getElementById('gameFrame').contentWindow;
            var flag = win.localStorage.getItem(api.HINT_STORAGE_PREFIX + 'ndl');
            assert(flag === '1', 'localStorage NDL flag should be set after trigger fires');
            return 'PASS — NDL trigger fires exactly once when NDL drops below threshold';
        }
